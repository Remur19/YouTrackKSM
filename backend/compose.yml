services:
  mongo:
    image: mongo
    ports: 
      - "27017:27017"
    networks:
      - default
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - default
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret

networks:
  default:
