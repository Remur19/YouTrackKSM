name: frontend

on:
  push:
    branches: [ main, test_leonhard ]
  pull_request:
    branches: [ main, test_leonhard ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip frontend]') == false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Optional: quick sanity check the dependency is present
      - run: npm ls @testing-library/jest-dom || true

      - run: npm run test:ci || npm test -- --ci --runInBand
        env:
          NODE_ENV: development

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip frontend]') == false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run ESLint
        run: npm run lint